[tool.poetry]
name = "scanner"
version = "0.1.0"
description = "Enterprise Security Scanner Foundation"
authors = ["Admin <admin@example.com>"]
readme = "README.md"
packages = [{include = "scanner", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.13,<3.15"
pydantic = "^2.8.2"
pydantic-settings = "^2.4.0"
dependency-injector = "^4.41.0"
pyyaml = "^6.0.1"
python-dotenv = "^1.0.1"
structlog = "^24.4.0"
tenacity = "^9.0.0"
aiometer = "^1.0.0"
httpx = "^0.28.1"
aiohttp = "^3.14.3"
requests = "^2.34.2"
aioquic = "^1.3.0"
playwright = "^1.61.0"
h2 = "^4.4.0"
selectolax = "^0.4.11"
beautifulsoup4 = "^4.15.0"
esprima = "^4.0.1"
fastapi = "^0.141.1"
uvicorn = "^0.52.0"
jinja2 = "^3.1.6"
sqlalchemy = "^2.0.51"
aiosqlite = "^0.22.1"
alembic = "^1.18.5"
websockets = "^17.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.2"
pytest-asyncio = "^0.23.8"
mypy = "^1.11.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
